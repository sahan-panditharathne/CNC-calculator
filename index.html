<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNC Job Cost Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #d97706;
      --accent-hover: #b45309;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; background: var(--card); border-radius: 12px; padding: 1.5rem; border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }

    h2 { margin-bottom: 1rem; color: var(--accent); font-size: 1.4rem; display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 1.2rem 0 0.5rem 0; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
    .full { grid-column: span 2; }

    label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
    input[type="number"], select { width: 100%; background: #090d16; border: 1px solid var(--border); color: #fff; padding: 0.6rem; border-radius: 6px; font-size: 0.95rem; outline: none; }
    input[type="number"]:focus, select:focus { border-color: var(--accent); }

    .unit-group { display: flex; gap: 0.25rem; }
    .unit-group input { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .unit-group select { border-top-left-radius: 0; border-bottom-left-radius: 0; width: 80px; flex-shrink: 0; }

    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; cursor: pointer; }
    .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .checkbox-group label { font-size: 0.85rem; color: var(--text); cursor: pointer; margin-bottom: 0; }

    .rounded-info { font-size: 0.8rem; color: var(--accent); margin-top: 0.3rem; font-weight: 500; min-height: 1.1rem; }

    .results { margin-top: 1.5rem; background: #090d16; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
    .result-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.4rem; color: var(--muted); }
    .result-row.total { font-size: 1.25rem; font-weight: bold; color: var(--accent); border-top: 1px dashed var(--border); padding-top: 0.6rem; margin-top: 0.6rem; }

    /* Mobile responsivity improvements */
    @media (max-width: 640px) {
      body { padding: 0.5rem; }
      .container { padding: 1rem; border-radius: 8px; }
      h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }
      .section-title { font-size: 0.75rem; margin: 1rem 0 0.4rem 0; }
      
      .grid { grid-template-columns: 1fr; gap: 0.6rem; }
      .grid-3 { grid-template-columns: 1fr; gap: 0.6rem; }
      .full { grid-column: span 1; }
      
      label { font-size: 0.75rem; margin-bottom: 0.2rem; }
      input[type="number"], select { padding: 0.55rem; font-size: 0.9rem; }
      
      .unit-group { flex-wrap: wrap; align-items: stretch; }
      .unit-group input { flex: 1; min-width: 0; }
      .unit-group select { width: 100%; margin-top: 0.25rem; border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
      
      .checkbox-group { gap: 0.4rem; margin-top: 0.5rem; }
      .checkbox-group label { font-size: 0.8rem; }
      
      .rounded-info { font-size: 0.75rem; margin-top: 0.2rem; }
      .results { margin-top: 1rem; padding: 0.75rem; }
      .result-row { font-size: 0.85rem; margin-bottom: 0.3rem; }
      .result-row.total { font-size: 1.1rem; padding-top: 0.5rem; margin-top: 0.5rem; }
    }

    @media (max-width: 480px) {
      body { padding: 0.25rem; }
      .container { padding: 0.75rem; }
      h2 { font-size: 1rem; margin-bottom: 0.6rem; }
      input[type="number"], select { padding: 0.5rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>CNC Job Estimator</h2>

  <!-- Material Presets -->
  <label for="materialPreset">Saved Material Presets</label>
  <select id="materialPreset" onchange="loadPreset()">
    <option value="custom">-- Custom Material --</option>
    <option value="eco8" selected>8mm Eco Board With Transport (4ft x 8ft - Rs. 7,500)</option>
    <option value="eco12">12mm Eco Board With Transport (4ft x 8ft - Rs. 10,500)</option>
    <option value="eco15">15mm Eco Board With Transport (4ft x 8ft - Rs. 12,975)</option>
    <option value="eco18">18mm Eco Board With Transport (4ft x 8ft - Rs. 15,000)</option>
  </select>

  <div class="section-title">1. Stock Material Cost</div>
  <div class="grid">
    <div>
      <label>Sheet Price (Rs.)</label>
      <input type="number" id="sheetPrice" value="7500" min="0" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
    </div>
    <div>
      <label>Sheet Dimensions (L × W)</label>
      <div class="unit-group">
        <input type="number" id="sheetL" value="4" min="0" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
        <input type="number" id="sheetW" value="8" min="0" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
        <select id="sheetUnit" onchange="calculate()">
          <option value="ft" selected>ft</option>
          <option value="in">in</option>
          <option value="mm">mm</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section-title">2. Job Material Area</div>
  <div class="grid">
    <div class="full">
      <label>Cut Area Dimensions (L × W)</label>
      <div class="unit-group">
        <input type="number" id="jobL" value="1219" min="0" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
        <input type="number" id="jobW" value="400" min="0" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
        <select id="jobUnit" onchange="calculate()">
          <option value="mm" selected>mm</option>
          <option value="in">in</option>
          <option value="ft">ft</option>
        </select>
      </div>
      
      <!-- Round up feature -->
      <div class="checkbox-group">
        <input type="checkbox" id="roundToFt" checked onchange="calculate()">
        <label for="roundToFt">Round up dimensions to nearest foot</label>
      </div>
      <div id="roundedDisplay" class="rounded-info"></div>
    </div>
  </div>

  <div class="section-title">3. Machining & Setup</div>
  <div class="grid-3">
    <div>
      <label>Time/Pass (min)</label>
      <input type="number" id="timePerPass" value="5" min="0" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
    </div>
    <div>
      <label>Passes</label>
      <input type="number" id="numPasses" value="1" min="1" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
    </div>
    <div>
      <label>Rate (Rs./min)</label>
      <input type="number" id="machineRate" value="60" min="0" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
    </div>
  </div>

  <div class="grid" style="margin-top: 0.75rem;">
    <div>
      <label>Design / Flat Fee (Rs.)</label>
      <input type="number" id="designFee" value="0" min="0" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
    </div>
    <div>
      <label>Profit Markup (%)</label>
      <input type="number" id="markup" value="20" min="0" onclick="this.select()" oninput="sanitizeNonNegativeNumber(this); calculate()">
    </div>
  </div>

  <!-- Output Display -->
  <div class="results">
    <div class="result-row">
      <span>Material Cost:</span>
      <span id="outMatCost">Rs. 0.00</span>
    </div>
    <div class="result-row">
      <span>Machining Cost (<span id="outTotalTime">0</span> min):</span>
      <span id="outMachCost">Rs. 0.00</span>
    </div>
    <div class="result-row">
      <span>Design / Flat Fee:</span>
      <span id="outDesignFee">Rs. 0.00</span>
    </div>
    <div class="result-row">
      <span>Subtotal Cost:</span>
      <span id="outSubtotal">Rs. 0.00</span>
    </div>
    <div class="result-row">
      <span>Markup Amount:</span>
      <span id="outMarkup">Rs. 0.00</span>
    </div>
    <div class="result-row total">
      <span>Final Quote:</span>
      <span id="outTotal">Rs. 0.00</span>
    </div>
  </div>
</div>

<script>
  // Conversion multipliers to feet (ft)
  const toFeet = {
    mm: 0.00328084,
    in: 1 / 12,
    ft: 1
  };

  const presets = {
    eco8:  { price: 7500,  l: 4, w: 8, unit: 'ft' },
    eco12: { price: 10500, l: 4, w: 8, unit: 'ft' },
    eco15: { price: 12975, l: 4, w: 8, unit: 'ft' },
    eco18: { price: 15000, l: 4, w: 8, unit: 'ft' }
  };

  function sanitizeNonNegativeNumber(input) {
    if (!input || input.type !== 'number') return;

    const raw = input.value;
    if (raw === '') return;

    const numericValue = Number(raw);
    if (Number.isNaN(numericValue)) {
      input.value = raw.replace(/^-+/, '');
      return;
    }

    if (numericValue < 0) {
      input.value = '0';
    }
  }

  function loadPreset() {
    const val = document.getElementById('materialPreset').value;
    if (val !== 'custom' && presets[val]) {
      const p = presets[val];
      document.getElementById('sheetPrice').value = p.price;
      document.getElementById('sheetL').value = p.l;
      document.getElementById('sheetW').value = p.w;
      document.getElementById('sheetUnit').value = p.unit;
      calculate();
    }
  }

  function calculate() {
    // Stock inputs
    const sheetPrice = parseFloat(document.getElementById('sheetPrice').value) || 0;
    const sheetL = parseFloat(document.getElementById('sheetL').value) || 0;
    const sheetW = parseFloat(document.getElementById('sheetW').value) || 0;
    const sheetUnit = document.getElementById('sheetUnit').value;

    // Job inputs
    const jobL = parseFloat(document.getElementById('jobL').value) || 0;
    const jobW = parseFloat(document.getElementById('jobW').value) || 0;
    const jobUnit = document.getElementById('jobUnit').value;
    const roundToFt = document.getElementById('roundToFt').checked;

    // Convert stock sheet area to square feet (ft²)
    const sheetAreaFt2 = (sheetL * toFeet[sheetUnit]) * (sheetW * toFeet[sheetUnit]);

    // Calculate job dimensions in feet
    let rawJobLFt = jobL * toFeet[jobUnit];
    let rawJobWFt = jobW * toFeet[jobUnit];
    
    let effectiveJobLFt = rawJobLFt;
    let effectiveJobWFt = rawJobWFt;

    const roundedDisplay = document.getElementById('roundedDisplay');

    if (roundToFt && (jobL > 0 || jobW > 0)) {
      // Only round up if the value has a significant fractional part (tolerance for floating point precision)
      const epsilon = 0.0001;
      const fracL = rawJobLFt % 1;
      const fracW = rawJobWFt % 1;
      
      effectiveJobLFt = (fracL < epsilon || fracL > 1 - epsilon) ? Math.round(rawJobLFt) : Math.ceil(rawJobLFt);
      effectiveJobWFt = (fracW < epsilon || fracW > 1 - epsilon) ? Math.round(rawJobWFt) : Math.ceil(rawJobWFt);
      roundedDisplay.innerText = `Calculated as: ${effectiveJobLFt} ft × ${effectiveJobWFt} ft`;
    } else {
      roundedDisplay.innerText = '';
    }

    const jobAreaFt2 = effectiveJobLFt * effectiveJobWFt;

    // Cost calculations
    let materialCost = 0;
    if (sheetAreaFt2 > 0) {
      const costPerFt2 = sheetPrice / sheetAreaFt2;
      materialCost = costPerFt2 * jobAreaFt2;
    }

    const timePerPass = parseFloat(document.getElementById('timePerPass').value) || 0;
    const numPasses = parseFloat(document.getElementById('numPasses').value) || 1;
    const machineRate = parseFloat(document.getElementById('machineRate').value) || 0;

    const designFee = parseFloat(document.getElementById('designFee').value) || 0;
    const markupPct = parseFloat(document.getElementById('markup').value) || 0;

    const totalMachineTime = timePerPass * numPasses;
    const machiningCost = totalMachineTime * machineRate;

    const subtotal = materialCost + machiningCost + designFee;
    const markupAmount = subtotal * (markupPct / 100);
    const finalTotal = subtotal + markupAmount;

    // Render results
    document.getElementById('outMatCost').innerText = `Rs. ${materialCost.toFixed(2)}`;
    document.getElementById('outTotalTime').innerText = totalMachineTime;
    document.getElementById('outMachCost').innerText = `Rs. ${machiningCost.toFixed(2)}`;
    document.getElementById('outDesignFee').innerText = `Rs. ${designFee.toFixed(2)}`;
    document.getElementById('outSubtotal').innerText = `Rs. ${subtotal.toFixed(2)}`;
    document.getElementById('outMarkup').innerText = `Rs. ${markupAmount.toFixed(2)}`;
    document.getElementById('outTotal').innerText = `Rs. ${Math.ceil(finalTotal).toLocaleString()}`;
  }

  // Initial load
  loadPreset();
</script>

</body>
</html>
